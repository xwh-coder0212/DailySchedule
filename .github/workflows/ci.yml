name: CI

# 这个仓库此前没有 CI —— docs/quality/README.md 里那句「项目没有 CI，
# 这些日志就是门禁确实跑过的唯一凭据」说的就是这件事。
# 结果就是：门禁成立与否，取决于「这次记不记得手动跑」。
#
# 两个 job 的分工：
#   quality —— 单测 + ktlint 门禁 + Android Lint。每次推送都跑，是硬门禁。
#   release —— 真的走一次 R8 与资源压缩。本地从未成功构建过 release，
#              所以混淆规则到底对不对，只有这里能持续替我们盯着。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: 单测 + ktlint 门禁 + Lint
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # app/build.gradle.kts 里 sourceCompatibility / jvmTarget 都是 21，
      # 版本对不上会直接编译不过，不用等到测试阶段才发现
      - name: 装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # compileSdk = 37，runner 预装的平台里不一定有，显式装一遍。
      #
      # 包名是 `platforms;android-37.0` 而**不是** `platforms;android-37` ——
      # SDK 从 API 36 之后改用「主版本.小版本」命名，仓库里只提供 37.0 / 37.1 / 37.2，
      # 没有不带小版本的那个。写错的话 `sdkmanager` 会直接报 Failed to find package
      # 并让这一步失败，两个 job 都过不去（本机实测：`sdkmanager --list` 里
      # 搜 `platforms;android-37` 前缀只有 37.0 / 37.1 / 37.2 三个）。
      - name: 装 Android SDK
        uses: android-actions/setup-android@v3
      - name: 装 compileSdk 对应的平台与构建工具
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v4

      # 不带 --rerun-tasks：CI 的 workspace 每次都是全新拉取，没有历史产物，
      # testDebugUnitTest 不可能是 UP-TO-DATE。本地才需要那个参数
      # （见 docs/quality/README.md 里那条「只看 BUILD SUCCESSFUL 可能什么都没跑」）。
      - name: 单元测试
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: ktlint 门禁（出现新违规即失败）
        run: ./gradlew :app:ktlintGate

      - name: Android Lint
        run: ./gradlew :app:lintDebug

      - name: 失败时上传测试报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-lint-reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-*.txt
            build/reports/ktlint/**
          if-no-files-found: ignore

  release:
    name: release 构建（R8 与资源压缩真的跑一次）
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # secrets 不能直接出现在 if 里，先经 env 中转再判断
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: 装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 装 Android SDK
        uses: android-actions/setup-android@v3
      - name: 装 compileSdk 对应的平台与构建工具
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v4

      # key.properties 在 .gitignore 里，仓库里没有这份文件。
      # 没配密钥时这一步跳过，后面的 assembleRelease 会产出 unsigned 包 ——
      # 那也够用：这一步要盯的是「R8 有没有把东西裁坏」，不是签名。
      - name: 还原发布密钥
        if: env.KEYSTORE_BASE64 != ''
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          {
            echo "storeFile=$KEYSTORE_PATH"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > key.properties
          echo "已写入 key.properties"

      - name: assembleRelease
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: 核对产物
        run: |
          set -e
          APK_DIR=app/build/outputs/apk/release
          ls -la "$APK_DIR"
          APK="$(find "$APK_DIR" -name '*.apk' | head -1)"
          echo "产物：$APK"
          # 混淆后的包里必须有 dex，且不能只剩一个空壳
          unzip -l "$APK" | grep -E 'classes.*\.dex'
          SIZE="$(stat -c %s "$APK")"
          echo "字节数：$SIZE"
          if [ "$SIZE" -lt 1000000 ]; then
            echo "::error::release 包小于 1MB，像是 R8 把东西裁空了"
            exit 1
          fi

      - name: 上传 release 包
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
