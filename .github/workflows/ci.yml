name: CI

# 这个仓库此前没有 CI —— docs/quality/README.md 里那句「项目没有 CI，
# 这些日志就是门禁确实跑过的唯一凭据」说的就是这件事。
# 结果就是：门禁成立与否，取决于「这次记不记得手动跑」。
#
# 两个 job 的分工：
#   quality —— 单测 + ktlint 门禁 + Android Lint。每次推送都跑，是硬门禁。
#   release —— 真的走一次 R8 与资源压缩。本地从未成功构建过 release，
#              所以混淆规则到底对不对，只有这里能持续替我们盯着。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: 单测 + ktlint 门禁 + Lint
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      # app/build.gradle.kts 里 sourceCompatibility / jvmTarget 都是 21，
      # 版本对不上会直接编译不过，不用等到测试阶段才发现
      - name: 装 JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # 曾经这里用的是 android-actions/setup-android@v3，首次推送时它自己就挂了
      # （那一步 failure，后面全被 skip）。GitHub 的注解提示它以及 checkout@v4 /
      # setup-java@v4 / upload-artifact@v4 都是为 Node.js 20 构建的，
      # 而 runner 已把这些 Action 强制迁到 Node.js 24 —— 老 Action 在这条路上会碎。
      # 现在这些 Action 全部升到当前大版本（它们声明的 runtime 已经是 node24）。
      #
      # Android SDK 也不再依赖第三方 Action：runner 镜像本来就预装了
      # ANDROID_HOME=/usr/local/lib/android/sdk，且平台清单里已有
      # android-37.0 与 build-tools 37.0.0。下面这步只是幂等兜底。
      - name: 确认编译需要的 SDK 组件在位（缺则补装）
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "SDK 根目录：$SDK"
          # 按候选路径逐个试，而不是 `find ... | sort | tail -1`。
          # 两条理由，都是「可能选错」而不是「一定选错」：
          #   1. 通配符会同时匹配到 lib/ 下的 sdkmanager-classpath.jar 之类，
          #      排序末位不一定落在 bin/ 上；
          #   2. find 默认不跟随符号链接目录（要加 -L），而 runner 上
          #      cmdline-tools/latest 常常是链接；[ -x ] 直接访问是会跟随的。
          # 本机没能复现第 2 条 —— Git Bash 的 `ln -s` 建出来的是真实目录而非链接，
          # 所以这里只把它当作「不依赖该行为」的写法，不当成已验证的故障。
          SDKMANAGER=""
          for c in "$SDK/cmdline-tools/latest/bin/sdkmanager" "$SDK"/cmdline-tools/*/bin/sdkmanager; do
            if [ -x "$c" ]; then SDKMANAGER="$c"; break; fi
          done
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::在 $SDK/cmdline-tools 下找不到可执行的 sdkmanager，runner 镜像结构与预期不符"
            exit 1
          fi
          echo "sdkmanager：$SDKMANAGER"
          # 平台包名是 `platforms;android-37.0` 而**不是** `platforms;android-37` ——
          # SDK 从 API 36 之后改用「主版本.小版本」命名，仓库里只提供 37.0 / 37.1 / 37.2。
          # 写错的话 sdkmanager 会报 Failed to find package 并让这一步失败。
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK" "platforms;android-37.0" "build-tools;37.0.0"
          echo "已装平台：$(ls "$SDK/platforms" | tr '\n' ' ')"
          echo "已装构建工具：$(ls "$SDK/build-tools" | tr '\n' ' ')"

      - uses: gradle/actions/setup-gradle@v6

      # 不带 --rerun-tasks：CI 的 workspace 每次都是全新拉取，没有历史产物，
      # testDebugUnitTest 不可能是 UP-TO-DATE。本地才需要那个参数
      # （见 docs/quality/README.md 里那条「只看 BUILD SUCCESSFUL 可能什么都没跑」）。
      - name: 单元测试
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: ktlint 门禁（出现新违规即失败）
        run: ./gradlew :app:ktlintGate

      - name: Android Lint
        run: ./gradlew :app:lintDebug

      - name: 失败时上传测试报告
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-and-lint-reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-*.txt
            build/reports/ktlint/**
          if-no-files-found: ignore

  release:
    name: release 构建（R8 与资源压缩真的跑一次）
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # secrets 不能直接出现在 if 里，先经 env 中转再判断
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - name: 装 JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: 确认编译需要的 SDK 组件在位（缺则补装）
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "SDK 根目录：$SDK"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -maxdepth 3 -type f -name sdkmanager 2>/dev/null | sort | tail -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::在 $SDK/cmdline-tools 下找不到 sdkmanager，runner 镜像结构与预期不符"
            exit 1
          fi
          echo "sdkmanager：$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK" "platforms;android-37.0" "build-tools;37.0.0"
          echo "已装平台：$(ls "$SDK/platforms" | tr '\n' ' ')"
          echo "已装构建工具：$(ls "$SDK/build-tools" | tr '\n' ' ')"

      - uses: gradle/actions/setup-gradle@v6

      # key.properties 在 .gitignore 里，仓库里没有这份文件。
      # 没配密钥时这一步跳过，后面的 assembleRelease 会产出 unsigned 包 ——
      # 那也够用：这一步要盯的是「R8 有没有把东西裁坏」，不是签名。
      - name: 还原发布密钥
        if: env.KEYSTORE_BASE64 != ''
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          {
            echo "storeFile=$KEYSTORE_PATH"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > key.properties
          echo "已写入 key.properties"

      - name: assembleRelease
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: 核对产物
        run: |
          set -euo pipefail
          APK_DIR=app/build/outputs/apk/release
          ls -la "$APK_DIR"
          APK="$(find "$APK_DIR" -name '*.apk' | head -1)"
          echo "产物：$APK"
          # 混淆后的包里必须有 dex，且不能只剩一个空壳
          unzip -l "$APK" | grep -E 'classes.*\.dex'
          SIZE="$(stat -c %s "$APK")"
          echo "字节数：$SIZE"
          if [ "$SIZE" -lt 1000000 ]; then
            echo "::error::release 包小于 1MB，像是 R8 把东西裁空了"
            exit 1
          fi

      - name: 上传 release 包
        uses: actions/upload-artifact@v7
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
