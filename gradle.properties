org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true

kotlin.code.style=official
kotlin.incremental.useClasspathSnapshot=true

# 首次构建：关闭配置缓存（Hilt/KSP 在配置缓存下易报不兼容），避免无谓失败
org.gradle.configuration-cache=false
# 国内/沙箱网络抖动：拉长 HTTP 超时，避免大依赖下载中断
systemProp.org.gradle.internal.http.socketTimeout=600000
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.repository.max.retries=5
systemProp.org.gradle.internal.repository.initial.backoff=2000
